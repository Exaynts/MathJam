<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My profile</title>

    <link rel="icon" href="images/logo.ico" />
    <link rel="import" href="header.html" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="import" href="footer.html" />
    <link rel="stylesheet" href="styles/footer.css" />
    <link rel="stylesheet" href="styles/cources.css" />
  </head>
  <body>
    <div id="header"></div>
    <main class="main">
      <!-- Секция с курсами -->
      <section class="courses">
        <h1>Courses</h1>
        <div class="course">
          <div class="course-header">
            <div class="course-name">
              <h3>Course name: Algebra</h3>
            </div>
            <div class="course-info">
              <div class="course-discount">Discount</div>
              <div class="course-price">Price</div>
              <button class="buy-button">Buy</button>
            </div>
          </div>
          <div class="course-body">
            <div class="course-description">
              <p>
                Course description Lorem ipsum dolor sit amet, consectetur
                adipiscing elit. Sed do eiusmod tempor incididunt ut labore et
                dolore magna aliqua. Ut enim ad minim veniam, quis nostrud
                exercitation ullamco laboris nisi ut aliquip ex ea commodo
                consequat.
              </p>
            </div>
            <div class="course-image">
              <img src="images/cources/Algebra.PNG" alt="Algebra" />
            </div>
          </div>
        </div>
        <div class="progress-bar"></div>
        <div class="continue-button"></div>
      </section>
    </main>

    <div id="footer"></div>
    <script src="js/header_and_footer.js"></script>
  </body>
</html>
