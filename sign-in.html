<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My profile</title>

    <link rel="icon" href="images/logo.ico" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/footer.css" />
    <link rel="stylesheet" href="styles/sign-in.css" />
  </head>
  <body>
    <div id="header"></div>
    <main class="main">
      <!-- Sign-in form -->
      <section class="data-form" id="login-form">
        <h1>Sign in</h1>
        <form class="login-form">
          <div class="form-group">
            <label for="login">Login</label>
            <input
              type="text"
              id="login"
              name="login"
              class="text-input"
              placeholder="Enter your login"
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              class="text-input"
              placeholder="Enter your password"
            />
          </div>

          <div class="forgot-links">
            <a href="#" class="forgot-link" onclick="showForgotPassword()"
              >forgot password?</a
            >
            <a href="#" class="forgot-link" onclick="showForgotLogin()"
              >forgot login?</a
            >
          </div>

          <button type="submit" class="sign-in-button">Sign in</button>
        </form>
      </section>

      <!-- Forgot-login form -->
      <section class="data-form hidden" id="forgot-login-form">
        <h1>Forgot Login</h1>
        <form class="login-form">
          <div class="form-group">
            <label for="email-or-phone">E-mail or Phone Number</label>
            <input
              type="text"
              id="email-or-phone"
              name="email-or-phone"
              class="text-input"
              placeholder="Enter your e-mail or phone number"
            />
          </div>

          <div class="form-group">
            <label for="password-recovery">Password</label>
            <input
              type="password"
              id="password-recovery"
              name="password-recovery"
              class="text-input"
              placeholder="Enter your password"
            />
          </div>

          <div class="faq-link">
            <p>
              If you have any problems, you can go to the
              <a href="#" class="faq-text">FAQ section</a>
            </p>
          </div>

          <button type="submit" class="sign-in-button">Recover Login</button>
          <button type="button" class="back-button" onclick="showLoginForm()">
            Back to Sign in
          </button>
        </form>
      </section>

      <!-- Forgot-password form -->
      <section class="data-form hidden" id="forgot-password-form">
        <h1>Forgot Password</h1>
        <form class="login-form">
          <div class="form-group">
            <label for="recovery-email">E-mail or phone number</label>
            <input
              type="text"
              id="recovery-email"
              name="recovery-email"
              class="text-input"
              placeholder="Enter your e-mail or phone number"
            />
          </div>
          <div class="form-group">
            <label for="phone-confirmation">Phone number</label>
            <input
              type="tel"
              id="phone-confirmation"
              name="phone-confirmation"
              class="text-input"
              placeholder="Confirm your phone number"
            />
          </div>
          <div class="faq-link">
            <p>
              If you have any problems, you can go to the
              <a href="#" class="faq-text">FAQ section</a>
            </p>
          </div>

          <button type="submit" class="sign-in-button">Reset Password</button>
          <button type="button" class="back-button" onclick="showLoginForm()">
            Back to Sign in
          </button>
        </form>
      </section>
    </main>

    <div id="footer"></div>
    <script src="js/header_and_footer.js"></script>
    <script src="js/sign-in.js"></script>
  </body>
</html>
