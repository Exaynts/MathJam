<!DOCTYPE html>
<html lang="en" id="htmlLang">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="My profile">My profile</title>

    <link rel="icon" href="images/logo.ico" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/footer.css" />
    <link rel="stylesheet" href="styles/profile.css" />
  </head>
  <body>
    <div id="header"></div>

    <main class="main">
      <aside class="aside">
        <div class="back-to-menu">
          <p data-i18n="Back to menu">Back to menu</p>
        </div>
        <div class="buy-new-course">
          <p data-i18n="Buy new course">Buy new course</p>
        </div>
        <div class="faq">
          <p data-i18n="FAQ">FAQ</p>
        </div>
      </aside>
      <div class="main-content">
        <section class="upper-menu">
          <div class="search">
            <form action="profile.html" method="GET">
              <input
                class="input-field"
                type="text"
                name="search"
                data-i18n-placeholder="Search for courses"
                placeholder="Search for courses"
              />
              <button type="submit" class="search-button">
                <svg
                  class="search-icon"
                  viewBox="0 0 24 24"
                  width="24"
                  height="24"
                >
                  <path
                    d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                  />
                </svg>
              </button>
            </form>
          </div>
          <div class="nickname">
            <p data-i18n="Name">Name</p>
          </div>
          <div class="avatar">
            <div class="avatar-circle"></div>
          </div>
        </section>
        <section class="courses">
          <h1 data-i18n="My courses">My courses</h1>
          <div class="course">
            <div class="course-name">
              <p>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Vitae
                veritatis, impedit distinctio aspernatur.
              </p>
            </div>
          </div>
          <div class="progress-bar"></div>
          <div class="coutinue-button"></div>
        </section>

        <section class="data">
          <div class="my-account">
            <h1 data-i18n="My account">My account</h1>
            <div class="account-grid">
              <div class="grid-item">
                <label for="login" data-i18n="Login">Login</label>
                <input
                  type="text"
                  id="login"
                  name="login"
                  data-i18n-placeholder="Enter your login"
                  placeholder="Enter your login"
                />
                <button type="button" class="pencil-button"></button>
              </div>
              <div class="grid-item">
                <label for="email" data-i18n="Email">E-mail</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  data-i18n-placeholder="Enter your email"
                  placeholder="Enter your email"
                />
                <button type="button" class="pencil-button"></button>
              </div>
              <div class="grid-item">
                <label for="password" data-i18n="Password">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  data-i18n-placeholder="Enter your password"
                  placeholder="Enter your password"
                />
                <button type="button" class="pencil-button"></button>
              </div>
              <div class="grid-item">
                <label for="phone" data-i18n="Phone number">Phone number</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  data-i18n-placeholder="Enter your phone number"
                  placeholder="Enter your phone number"
                />
                <button type="button" class="pencil-button"></button>
              </div>
            </div>
          </div>
          <div class="about-me">
            <h1 data-i18n="About me">About me</h1>
            <div class="about-grid">
              <div class="grid-item">
                <label for="name" data-i18n="Name">Name</label>
                <input
                  type="text"
                  id="name"
                  name="name"
                  data-i18n-placeholder="Enter your name"
                  placeholder="Enter your name"
                />
                <button type="button" class="pencil-button"></button>
              </div>
              <div class="grid-item">
                <label for="surname" data-i18n="Surname">Surname</label>
                <input
                  type="text"
                  id="surname"
                  name="surname"
                  data-i18n-placeholder="Enter your surname"
                  placeholder="Enter your surname"
                />
                <button type="button" class="pencil-button"></button>
              </div>
              <div class="grid-item">
                <label for="birthdate" data-i18n="Date of birth"
                  >Date of birth</label
                >
                <input type="date" id="birthdate" name="birthdate" />
              </div>
              <div class="grid-item">
                <label for="sex" data-i18n="Sex">Sex</label>
                <select id="sex" name="sex">
                  <option value="" data-i18n="Select sex">Select sex</option>
                  <option value="male" data-i18n="Male">Male</option>
                  <option value="female" data-i18n="Female">Female</option>
                  <option value="other" data-i18n="Other">Other</option>
                </select>
              </div>
              <div class="grid-item">
                <label for="math-level" data-i18n="Math level"
                  >Math level</label
                >
                <select id="math-level" name="math-level">
                  <option value="" data-i18n="Select math level">
                    Select math level
                  </option>
                  <option value="beginner" data-i18n="Beginner">
                    Beginner
                  </option>
                  <option value="intermediate" data-i18n="Intermediate">
                    Intermediate
                  </option>
                  <option value="advanced" data-i18n="Advanced">
                    Advanced
                  </option>
                </select>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div id="footer"></div>
    <script src="js/translator.js"></script>
    <script src="js/header_and_footer.js"></script>
  </body>
</html>
