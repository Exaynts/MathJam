<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My profile</title>

    <link rel="icon" href="images/logo.ico" />
    <link rel="import" href="header.html" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="import" href="footer.html" />
    <link rel="stylesheet" href="styles/footer.css" />
    <link rel="stylesheet" href="styles/profile.css" />
  </head>
  <body>
    <div id="header"></div>

    <main class="main">
      <aside class="aside">
        <div class="back-to-menu">
          <p>Back to menu</p>
        </div>
        <div class="buy-new-course">
          <p>Buy new course</p>
        </div>
        <div class="faq">
          <p>FAQ</p>
        </div>
      </aside>
      <div class="main-content">
        <section class="upper-menu">
          <div class="search">
            <form action="cources.html" method="GET">
              <input
                class="input-field"
                type="text"
                name="search"
                placeholder="Search for courses"
              />
              <button type="submit" class="search-button">
                <svg
                  class="search-icon"
                  viewBox="0 0 24 24"
                  width="24"
                  height="24"
                >
                  <!-- Значок лупы-->
                  <path
                    d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"
                  />
                </svg>
              </button>
            </form>
          </div>
          <div class="nickname">
            <p>Name</p>
          </div>
          <div class="avatar">
            <div class="avatar-circle"></div>
          </div>
        </section>
        <section class="courses">
          <h1>My courses</h1>
          <div class = "course">
            <div class="course-name">
            <p> Lorem ipsum dolor sit amet consectetur adipisicing elit. Vitae
              veritatis, impedit distinctio aspernatur. </p>
            </div>
          </div>
          <div class="progress-bar"></div>
          <div class="coutinue-button"></div>
        </section>

        <section class="data">
          <div class="my-account">
            <h1>My account</h1>
            <div class="account-grid">
              <div class="grid-item">
                <label for="login">Login</label>
                <input type="text" id="login" name="login" placeholder="Enter your login">
              </div>
              <div class="grid-item">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
              </div>
              <div class="grid-item">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password">
              </div>
              <div class="grid-item">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">
              </div>
            </div>
          </div>
          <div class="about-me">
            <h1>About me</h1>
            <div class="about-grid">
              <div class="grid-item">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name">
              </div>
              <div class="grid-item">
                <label for="surname">Surname</label>
                <input type="text" id="surname" name="surname" placeholder="Enter your surname">
              </div>
              <div class="grid-item">
                <label for="birthdate">Date of birth</label>
                <input type="date" id="birthdate" name="birthdate">
              </div>
              <div class="grid-item">
                <label for="sex">Sex</label>
                <select id="sex" name="sex">
                  <option value="">Select sex</option>
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                  <option value="other">Other</option>
                </select>
              </div>
              <div class="grid-item">
                <label for="math-level">Math level</label>
                <select id="math-level" name="math-level">
                  <option value="">Select math level</option>
                  <option value="beginner">Beginner</option>
                  <option value="intermediate">Intermediate</option>
                  <option value="advanced">Advanced</option>
                </select>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <div id="footer"></div>
    <script src="js/header_and_footer.js"></script>
  </body>
</html>
