<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="MathJam">MathJam</title>
    <link rel="icon" href="images/logo.ico" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/footer.css" />
    <link rel="stylesheet" href="styles/index-style.css" />
  </head>

  <body>
    <div id="header"></div>
    <main class="main">
      <div class="content-wrapper">
        <div class="intro-block">
          <h1 data-i18n="Learn with MathJam!">Learn with MathJam!</h1>
          <p class="intro-text" data-i18n="Would you like to start your educational journey Right Now?">
            Would you like to start <br />
            your educational journey Right Now?
          </p>
          <div class="get-started">
            <p data-i18n="Get Started">Get Started</p>
          </div>
        </div>
        <!-- carousel-images -->
        <div class="carousel-container">
          <div class="carousel">
            <div class="carousel-slides">
              <div class="carousel-slide">
                <img class="carousel-image" src="images/index/image1.PNG" alt="Math concept 1">
              </div>
              <div class="carousel-slide">
                <img class="carousel-image" src="images/index/image2.PNG" alt="Math concept 2">
              </div>
              <div class="carousel-slide">
                <img class="carousel-image" src="images/index/image3.PNG" alt="Math concept 3">
              </div>
            </div>
            <button class="carousel-btn prev">‹</button>
            <button class="carousel-btn next">›</button>
            <div class="carousel-indicators">
              <span class="carousel-indicator active" data-slide="0"></span>
              <span class="carousel-indicator" data-slide="1"></span>
              <span class="carousel-indicator" data-slide="2"></span>
            </div>
          </div>
          <p class="promotion-phrase" data-i18n="Don't be afraid to try! The first lesson is free!">
            Don't be afraid to try! The first lesson is free!
          </p>
        </div>
      </div>
    </main>
    <div id="footer"></div>
    
    <script src="js/translator.js"></script>
    <script src="js/header_and_footer.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
